name: Python Wheels

on:
  workflow_call:
    inputs:
      python-versions:
        type: string
        default: '["3.9", "3.13", "3.14"]'

permissions:
  contents: read

jobs:
  wheels:
    name: ${{ matrix.platform.target }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJSON(inputs.python-versions) }}
        platform:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: windows-2022
            target: x86_64-pc-windows-msvc
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-15
            target: aarch64-apple-darwin
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform.target }}

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          maturin-version: v1.15.0
          target: ${{ matrix.platform.target }}
          manylinux: "2_28"
          args: >-
            --release --locked --manifest-path crates/sanqi-python/Cargo.toml
            --interpreter ${{ runner.os == 'Windows' && 'python' || format('python{0}', matrix.python-version) }} --out dist

      - name: Install and test wheel
        run: |
          python -m pip install --no-index --find-links dist sanqi-python
          python -m unittest discover -s crates/sanqi-python/tests

      - name: Upload wheel
        uses: actions/upload-artifact@v7
        with:
          name: python-package-${{ matrix.platform.target }}-${{ matrix.python-version }}
          path: dist/*.whl
          if-no-files-found: error
