name: Dependency Security

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: "23 7 * * 1"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  audit:
    name: RustSec dependency audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-audit
        run: cargo +stable install cargo-audit --locked

      - name: Check dependencies against RustSec advisories
        run: cargo +stable audit --deny warnings
