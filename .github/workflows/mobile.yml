name: Mobile

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
          cache: true
      - name: Build host bridge
        run: cargo build -p sanqi-mobile --locked
      - name: Fetch Flutter dependencies
        working-directory: mobile/flutter_app
        run: flutter pub get --enforce-lockfile
      - name: Check Dart formatting
        working-directory: mobile/flutter_app
        run: dart format --output=none --set-exit-if-changed lib test integration_test
      - name: Analyze Flutter
        working-directory: mobile/flutter_app
        run: flutter analyze
      - name: Run widget and real bridge tests
        working-directory: mobile/flutter_app
        run: flutter test
      - name: Build Android APK
        working-directory: mobile/flutter_app
        run: flutter build apk --debug --target-platform android-arm64
      - name: Verify bundled Rust library
        working-directory: mobile/flutter_app
        run: python3 -c "import zipfile; assert 'lib/arm64-v8a/libsanqi_mobile.so' in zipfile.ZipFile('build/app/outputs/flutter-apk/app-debug.apk').namelist()"
      - uses: actions/upload-artifact@v7
        if: success()
        with:
          name: sanqi-android-debug
          path: mobile/flutter_app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
          cache: true
      - name: Fetch Flutter dependencies
        working-directory: mobile/flutter_app
        run: flutter pub get --enforce-lockfile
      - name: Build iOS simulator app
        working-directory: mobile/flutter_app
        run: flutter build ios --simulator --debug
