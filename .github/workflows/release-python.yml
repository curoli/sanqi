name: Release Python Package

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify release version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify release tag matches Python package version
        if: github.ref_type == 'tag'
        run: |
          expected_version="$(grep -E '^version = ' crates/sanqi-python/pyproject.toml | head -n1 | cut -d'"' -f2)"
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$tag_version" != "$expected_version" ]; then
            echo "tag version $tag_version does not match Python package version $expected_version"
            exit 1
          fi

  security:
    needs: verify
    uses: ./.github/workflows/security.yml

  wheels:
    needs: verify
    uses: ./.github/workflows/python-wheels.yml
    with:
      python-versions: '["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]'

  sdist:
    name: Build source distribution
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install maturin
        run: python -m pip install --upgrade pip 'maturin>=1.7,<2.0'

      - name: Build source distribution
        run: maturin sdist --manifest-path crates/sanqi-python/Cargo.toml --out dist

      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: python-package-sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: [security, wheels, sdist]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/sanqi-python
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          pattern: python-package-*
          merge-multiple: true
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
