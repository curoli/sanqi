[workspace]
members = [
    "crates/sanqi-cli",
    "crates/sanqi-core",
    "crates/sanqi-engine",
    "crates/sanqi-render",
    "crates/sanqi-python",
    "crates/sanqi-mobile",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.1.2"
repository = "https://github.com/curoli/sanqi"
rust-version = "1.88"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unwrap_used = "deny"

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
